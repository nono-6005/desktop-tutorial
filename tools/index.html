<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 { margin-bottom: 20px; }
    .grid {
      display: grid;
      gap: 12px;
    }
    a.tool {
      display: block;
      padding: 18px;
      border-radius: 14px;
      background: white;
      text-decoration: none;
      color: inherit;
      border: 1px solid #e5e5e5;
    }
    a.tool:hover { background: #fafafa; }
    .title { font-weight: 700; margin-bottom: 4px; }
    .desc { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>My Tools</h1>

    <div class="grid">
      <a class="tool" href="./threads.html">
        <div class="title">Threadsデモ</div>
        <div class="desc">投稿・ツリーの表示確認</div>
      </a>

      <a class="tool" href="./json-storage.html">
        <div class="title">JSON保管庫</div>
        <div class="desc">データ保存・バックアップ・復元</div>
      </a>
    </div>
  </main>
</body>
</html>
