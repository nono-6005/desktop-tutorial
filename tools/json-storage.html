<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON保管庫</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 12px 16px;
    }

    header .inner,
    main {
      max-width: 760px;
      margin: 0 auto;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    main {
      padding: 16px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    input,
    textarea {
      width: 100%;
      font: inherit;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #eee;
    }

    .danger {
      background: #f5e5e5;
      color: #8a1111;
    }

    .record {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f8f8f8;
      padding: 12px;
      border-radius: 12px;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      main { padding: 12px; }
      button { flex: 1; }
    }
  </style>
</head>

<body>
  <header>
    <div class="inner">
      <a href="./index.html">← My Tools</a>
    </div>
  </header>

  <main>
    <section class="panel">
      <h1>JSON保管庫</h1>
      <p class="muted">このブラウザ内にのみ保存されます（端末間の同期はありません）。</p>
    </section>

    <section class="panel">
      <input id="title" placeholder="タイトル">

      <textarea
        id="jsonInput"
        placeholder='{"example":"value"}'
      ></textarea>

      <div class="row">
        <button id="saveBtn" class="primary">保存</button>
        <button id="formatBtn" class="secondary">整形</button>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <button id="refreshBtn" class="secondary">再読み込み</button>
        <button id="exportBtn" class="secondary">全件Export</button>

        <label>
          <input id="importFile" type="file" accept=".json,application/json">
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>保存データ</h2>
      <div id="records"></div>
    </section>
  </main>

  <script type="module">
    import {
      listRecords,
      createRecord,
      deleteRecord,
      downloadJson,
      readJsonFile
    } from "./app.js";

    const title = document.querySelector("#title");
    const jsonInput = document.querySelector("#jsonInput");
    const saveBtn = document.querySelector("#saveBtn");
    const formatBtn = document.querySelector("#formatBtn");
    const refreshBtn = document.querySelector("#refreshBtn");
    const exportBtn = document.querySelector("#exportBtn");
    const importFile = document.querySelector("#importFile");
    const records = document.querySelector("#records");

    async function renderRecords() {
      const items = await listRecords("json_data");

      if (!items.length) {
        records.innerHTML = '<p class="muted">データはまだありません。</p>';
        return;
      }

      records.innerHTML = "";

      for (const item of items) {
        const wrap = document.createElement("article");
        wrap.className = "record";

        const h3 = document.createElement("h3");
        h3.textContent = item.title || "無題";

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(item.data, null, 2);

        const row = document.createElement("div");
        row.className = "row";

        const loadBtn = document.createElement("button");
        loadBtn.className = "secondary";
        loadBtn.textContent = "読み込み";
        loadBtn.addEventListener("click", () => {
          title.value = item.title || "";
          jsonInput.value = JSON.stringify(item.data, null, 2);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("このデータを削除しますか？")) return;
          await deleteRecord(item.id);
          await renderRecords();
        });

        row.append(loadBtn, deleteBtn);
        wrap.append(h3, pre, row);
        records.appendChild(wrap);
      }
    }

    formatBtn.addEventListener("click", () => {
      try {
        const parsed = JSON.parse(jsonInput.value);
        jsonInput.value = JSON.stringify(parsed, null, 2);
      } catch {
        alert("JSONの形式が不正です");
      }
    });

    saveBtn.addEventListener("click", async () => {
      let parsed;

      try {
        parsed = JSON.parse(jsonInput.value);
      } catch {
        return alert("JSONの形式が不正です");
      }

      await createRecord({
        type: "json_data",
        title: title.value.trim(),
        data: parsed
      });

      title.value = "";
      jsonInput.value = "";

      await renderRecords();
    });

    refreshBtn.addEventListener("click", renderRecords);

    exportBtn.addEventListener("click", async () => {
      const items = await listRecords("json_data");
      downloadJson("json-storage-backup.json", items);
    });

    importFile.addEventListener("change", async () => {
      const file = importFile.files?.[0];
      if (!file) return;

      const imported = await readJsonFile(file);

      const list = Array.isArray(imported)
        ? imported
        : [imported];

      if (!confirm(`${list.length}件を追加保存しますか？`)) {
        importFile.value = "";
        return;
      }

      for (const item of list) {
        await createRecord({
          type: "json_data",
          title: item.title ?? "",
          content: item.content ?? "",
          data: item.data ?? item
        });
      }

      importFile.value = "";
      await renderRecords();
    });

    renderRecords();
  </script>
</body>
</html>
