<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threadsデモ</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #eee;
      padding: 12px 16px;
    }

    header .inner,
    main {
      max-width: 680px;
      margin: 0 auto;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    main {
      padding: 16px;
    }

    .panel {
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    textarea,
    input {
      width: 100%;
      font: inherit;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #111;
    }

    .danger {
      background: #f5e5e5;
      color: #8a1111;
    }

    .post {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }

    .post-head {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ddd;
      flex: 0 0 auto;
    }

    .name {
      font-weight: 700;
    }

    .content {
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .tree {
      margin-left: 20px;
      padding-left: 18px;
      border-left: 2px solid #eee;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      header { padding: 10px 12px; }
      main { padding: 12px; }
      .panel { border-radius: 14px; }
      button { flex: 1; }
    }
  </style>
</head>

<body>
  <header>
    <div class="inner">
      <a href="./index.html">← My Tools</a>
    </div>
  </header>

  <main>
    <section class="panel">
      <h1>Threadsデモ</h1>

      <div id="authLoggedOut">
        <input id="email" type="email" placeholder="メールアドレス">
        <div class="row">
          <button id="loginBtn" class="primary">ログインリンクを送る</button>
        </div>
        <p class="muted">
          Supabase AuthのMagic Linkを使用します。
        </p>
      </div>

      <div id="authLoggedIn" class="hidden">
        <div class="row">
          <button id="logoutBtn" class="secondary">ログアウト</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <textarea id="postText" placeholder="投稿内容"></textarea>

      <div class="row">
        <button id="savePostBtn" class="primary">投稿を保存</button>
        <button id="addTreeBtn" class="secondary">ツリーを追加</button>
      </div>

      <div id="treeInputs"></div>
    </section>

    <section class="panel">
      <div class="row">
        <button id="refreshBtn" class="secondary">再読み込み</button>
        <button id="exportBtn" class="secondary">JSON書き出し</button>
        <button id="resetBtn" class="danger">TLをリセット</button>
      </div>
    </section>

    <section id="timeline"></section>
  </main>

  <script type="module">
    import {
      supabase,
      getCurrentUser,
      signInWithEmail,
      signOut,
      listRecords,
      createRecord,
      deleteRecord,
      downloadJson
    } from "./app.js";

    const email = document.querySelector("#email");
    const loginBtn = document.querySelector("#loginBtn");
    const logoutBtn = document.querySelector("#logoutBtn");
    const authLoggedOut = document.querySelector("#authLoggedOut");
    const authLoggedIn = document.querySelector("#authLoggedIn");

    const postText = document.querySelector("#postText");
    const savePostBtn = document.querySelector("#savePostBtn");
    const addTreeBtn = document.querySelector("#addTreeBtn");
    const treeInputs = document.querySelector("#treeInputs");
    const timeline = document.querySelector("#timeline");
    const refreshBtn = document.querySelector("#refreshBtn");
    const exportBtn = document.querySelector("#exportBtn");
    const resetBtn = document.querySelector("#resetBtn");

    let treeCount = 0;

    function addTreeInput(value = "") {
      treeCount++;

      const wrap = document.createElement("div");
      wrap.style.marginTop = "10px";

      const textarea = document.createElement("textarea");
      textarea.placeholder = `ツリー ${treeCount}`;
      textarea.value = value;
      textarea.dataset.treeInput = "true";

      wrap.appendChild(textarea);
      treeInputs.appendChild(wrap);
    }

    async function refreshAuth() {
      const user = await getCurrentUser().catch(() => null);
      authLoggedOut.classList.toggle("hidden", !!user);
      authLoggedIn.classList.toggle("hidden", !user);
      return user;
    }

    async function renderTimeline() {
      const user = await refreshAuth();

      if (!user) {
        timeline.innerHTML = '<p class="muted">ログインすると保存済み投稿を表示できます。</p>';
        return;
      }

      const records = await listRecords("threads_post");

      if (!records.length) {
        timeline.innerHTML = '<p class="muted">投稿はまだありません。</p>';
        return;
      }

      timeline.innerHTML = "";

      for (const record of records) {
        const post = document.createElement("article");
        post.className = "post";

        const head = document.createElement("div");
        head.className = "post-head";
        head.innerHTML = `
          <div class="avatar"></div>
          <div>
            <div class="name">demo_user</div>
            <div class="muted">${new Date(record.created_at).toLocaleString()}</div>
          </div>
        `;

        const content = document.createElement("div");
        content.className = "content";
        content.textContent = record.content;

        post.append(head, content);

        const tree = Array.isArray(record.data?.tree)
          ? record.data.tree
          : [];

        if (tree.length) {
          const treeWrap = document.createElement("div");
          treeWrap.className = "tree";

          for (const childText of tree) {
            const child = document.createElement("div");
            child.className = "post";
            child.innerHTML = `
              <div class="post-head">
                <div class="avatar"></div>
                <div class="name">demo_user</div>
              </div>
            `;

            const childContent = document.createElement("div");
            childContent.className = "content";
            childContent.textContent = childText;

            child.appendChild(childContent);
            treeWrap.appendChild(child);
          }

          post.appendChild(treeWrap);
        }

        const actions = document.createElement("div");
        actions.className = "row";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("この投稿を削除しますか？")) return;
          await deleteRecord(record.id);
          await renderTimeline();
        });

        actions.appendChild(deleteBtn);
        post.appendChild(actions);

        timeline.appendChild(post);
      }
    }

    loginBtn.addEventListener("click", async () => {
      const value = email.value.trim();
      if (!value) return alert("メールアドレスを入力してください");

      await signInWithEmail(value);
      alert("ログイン用リンクを送信しました");
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut();
      await renderTimeline();
    });

    addTreeBtn.addEventListener("click", () => {
      addTreeInput();
    });

    savePostBtn.addEventListener("click", async () => {
      const content = postText.value.trim();

      if (!content) {
        return alert("投稿内容を入力してください");
      }

      const tree = [...document.querySelectorAll("[data-tree-input]")]
        .map(el => el.value.trim())
        .filter(Boolean);

      await createRecord({
        type: "threads_post",
        content,
        data: { tree }
      });

      postText.value = "";
      treeInputs.innerHTML = "";
      treeCount = 0;

      await renderTimeline();
    });

    refreshBtn.addEventListener("click", renderTimeline);

    exportBtn.addEventListener("click", async () => {
      const records = await listRecords("threads_post");
      downloadJson("threads-backup.json", records);
    });

    resetBtn.addEventListener("click", async () => {
      const records = await listRecords("threads_post");

      if (!records.length) return;

      if (!confirm("TLの投稿をすべて削除しますか？")) return;

      for (const record of records) {
        await deleteRecord(record.id);
      }

      await renderTimeline();
    });

    supabase.auth.onAuthStateChange(() => {
      renderTimeline();
    });

    renderTimeline();
  </script>
</body>
</html>
