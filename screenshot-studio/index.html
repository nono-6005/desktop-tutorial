<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ブラウザ内でスクリーンショットを撮影・保存するPWAアプリ">
    <title>Screenshot Studio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Screenshot Studio">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232563eb' width='192' height='192'/><text x='50%' y='50%' font-size='80' fill='white' text-anchor='middle' dominant-baseline='central'>📸</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg: #ffffff;
            --bg-secondary: #f3f4f6;
            --text: #1f2937;
            --border: #d1d5db;
            --success: #10b981;
            --danger: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f2937;
                --bg-secondary: #111827;
                --text: #f3f4f6;
                --border: #4b5563;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: var(--border);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .capture-section {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .status {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .status.show {
            display: flex;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #7f1d1d;
            border: 1px solid #fca5a5;
        }

        @media (prefers-color-scheme: dark) {
            .status.success {
                background: #064e3b;
                color: #d1fae5;
            }
            .status.error {
                background: #7f1d1d;
                color: #fee2e2;
            }
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-secondary);
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-actions {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .gallery-item:hover .gallery-item-actions {
            opacity: 1;
        }

        .gallery-item-btn {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .gallery-item-btn:hover {
            background: var(--primary-dark);
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .selection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            cursor: crosshair;
            z-index: 9999;
            display: none;
        }

        .selection-overlay.active {
            display: block;
        }

        .selection-box {
            position: fixed;
            border: 2px solid var(--primary);
            background: rgba(37, 99, 235, 0.1);
            z-index: 10000;
            display: none;
            pointer-events: none;
        }

        .selection-box.active {
            display: block;
        }

        .tooltip {
            position: fixed;
            background: #1f2937;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10001;
            pointer-events: none;
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            .tooltip {
                background: #f3f4f6;
                color: #1f2937;
            }
        }

        .tooltip.show {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10002;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            border-radius: 8px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-image {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-text {
            font-size: 12px;
            color: var(--text);
            opacity: 0.7;
            margin-top: 8px;
        }

        .setting-group {
            margin-bottom: 16px;
        }

        .setting-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .setting-select,
        .setting-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        .setting-select:focus,
        .setting-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span style="font-size: 32px;">📸</span>
            <h1>Screenshot Studio</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="capture">撮影</button>
            <button class="tab-btn" data-tab="gallery">ギャラリー</button>
            <button class="tab-btn" data-tab="settings">設定</button>
        </div>

        <!-- Capture Tab -->
        <div id="capture" class="tab-content active">
            <div class="capture-section">
                <div class="status" id="status"></div>

                <div class="controls">
                    <button class="btn btn-primary" id="fullscreenBtn">
                        <span>🖥️</span> 全画面撮影
                    </button>
                    <button class="btn btn-primary" id="selectionBtn">
                        <span>🎯</span> 領域選択
                    </button>
                    <button class="btn btn-secondary" id="clipboardBtn">
                        <span>📋</span> クリップボード
                    </button>
                </div>

                <div class="info-text" id="captureInfo">
                    クリックしてスクリーンショットを撮影します。撮影した画像はブラウザに自動保存されます。
                </div>
            </div>
        </div>

        <!-- Gallery Tab -->
        <div id="gallery" class="tab-content">
            <div class="capture-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="font-size: 18px;">保存済みスクリーンショット</h2>
                    <button class="btn btn-danger" id="clearAllBtn" style="display: none;">
                        すべて削除
                    </button>
                </div>
                <div id="galleryContainer" class="gallery">
                    <div class="empty-state">
                        <div class="empty-state-icon">📸</div>
                        <p>まだスクリーンショットはありません</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <div class="capture-section">
                <h2 style="font-size: 18px; margin-bottom: 16px;">設定</h2>

                <div class="setting-group">
                    <label class="setting-label">画像品質</label>
                    <input type="range" id="qualitySlider" class="setting-input" min="0.5" max="1" step="0.1" value="0.95" style="padding: 0;">
                    <div class="info-text" id="qualityValue">品質: 95%</div>
                </div>

                <div class="setting-group">
                    <label class="setting-label">保存形式</label>
                    <select id="formatSelect" class="setting-select">
                        <option value="png">PNG（ロスレス、推奨）</option>
                        <option value="jpeg">JPEG（軽量）</option>
                        <option value="webp">WebP（モダン形式）</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label class="setting-label">クリップボード撮影範囲</label>
                    <select id="clipboardSourceSelect" class="setting-select">
                        <option value="viewport">現在のビューポート</option>
                        <option value="fullpage">ページ全体</option>
                    </select>
                </div>

                <div class="setting-group">
                    <button class="btn btn-primary" id="testCaptureBtn">
                        テスト撮影
                    </button>
                </div>

                <div class="info-text" style="margin-top: 24px;">
                    <strong>情報:</strong><br>
                    すべてのスクリーンショットはブラウザのローカルストレージ（IndexedDB）に保存されます。<br>
                    データはあなたのデバイス内にのみ保存され、外部サーバーに送信されることはありません。
                </div>
            </div>
        </div>
    </div>

    <!-- Selection Overlay -->
    <div id="selectionOverlay" class="selection-overlay"></div>
    <div id="selectionBox" class="selection-box"></div>
    <div id="tooltip" class="tooltip"></div>

    <!-- Image Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <img id="previewImage" class="modal-image" alt="プレビュー">
            <div class="modal-actions">
                <button class="btn btn-secondary" id="closePreviewBtn">閉じる</button>
                <button class="btn btn-primary" id="downloadPreviewBtn">ダウンロード</button>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Setup
        const DB_NAME = 'ScreenshotStudio';
        const STORE_NAME = 'screenshots';

        let db;
        let currentImage = null;
        let isSelecting = false;
        let selectionStart = null;

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (e) => {
                    const store = e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    store.createIndex('timestamp', 'timestamp', { unique: false });
                };
            });
        }

        async function saveScreenshot(blob, metadata = {}) {
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = {
                        id: Date.now(),
                        timestamp: new Date().toISOString(),
                        imageData: e.target.result,
                        width: metadata.width || 0,
                        height: metadata.height || 0,
                        format: metadata.format || 'png'
                    };

                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.add(data);

                    request.onsuccess = () => {
                        showStatus(`スクリーンショットを保存しました`, 'success');
                        resolve(data.id);
                    };
                    request.onerror = () => showStatus('保存に失敗しました', 'error');
                };
                reader.readAsDataURL(blob);
            });
        }

        async function loadGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';

            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const index = store.index('timestamp');
                const request = index.getAll();

                request.onsuccess = () => {
                    const items = request.result.reverse();

                    if (items.length === 0) {
                        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📸</div><p>まだスクリーンショットはありません</p></div>';
                        document.getElementById('clearAllBtn').style.display = 'none';
                        resolve();
                        return;
                    }

                    document.getElementById('clearAllBtn').style.display = 'block';

                    items.forEach(item => {
                        const element = document.createElement('div');
                        element.className = 'gallery-item';
                        element.innerHTML = `
                            <img src="${item.imageData}" alt="Screenshot">
                            <div class="gallery-item-actions">
                                <button class="gallery-item-btn" title="プレビュー">👁️</button>
                                <button class="gallery-item-btn" title="ダウンロード">⬇️</button>
                                <button class="gallery-item-btn" title="削除">🗑️</button>
                            </div>
                        `;

                        const buttons = element.querySelectorAll('.gallery-item-btn');
                        buttons[0].onclick = () => showPreview(item.imageData);
                        buttons[1].onclick = () => downloadImage(item.imageData, item.id, item.format);
                        buttons[2].onclick = () => deleteScreenshot(item.id);

                        container.appendChild(element);
                    });
                    resolve();
                };
            });
        }

        async function deleteScreenshot(id) {
            if (!confirm('このスクリーンショットを削除しますか？')) return;

            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);

                request.onsuccess = () => {
                    loadGallery();
                    showStatus('削除しました', 'success');
                    resolve();
                };
            });
        }

        async function clearAllScreenshots() {
            if (!confirm('すべてのスクリーンショットを削除しますか？')) return;

            return new Promise((resolve) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();

                request.onsuccess = () => {
                    loadGallery();
                    showStatus('すべてのスクリーンショットを削除しました', 'success');
                    resolve();
                };
            });
        }

        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = `status show ${type}`;
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showPreview(imageData) {
            document.getElementById('previewImage').src = imageData;
            document.getElementById('previewModal').classList.add('show');
            currentImage = imageData;
        }

        function downloadImage(imageData, id, format) {
            const link = document.createElement('a');
            link.href = imageData;
            const date = new Date(id).toISOString().replace(/[:.]/g, '-').slice(0, -5);
            link.download = `screenshot-${date}.${format}`;
            link.click();
            showStatus('ダウンロードしました', 'success');
        }

        async function captureFullscreen() {
            try {
                const format = document.getElementById('formatSelect').value;
                const quality = parseFloat(document.getElementById('qualitySlider').value);

                showStatus('撮影中...', '');

                const canvas = await html5QrCode.scannerPlaceholder();
                const canvases = document.querySelectorAll('canvas');
                if (canvases.length > 0) {
                    const ctx = canvases[0].getContext('2d');
                }

                // Use html2canvas polyfill approach
                const screenshotCanvas = await captureVisibleTab();
                screenshotCanvas.toBlob(async (blob) => {
                    await saveScreenshot(blob, { format, width: screenshotCanvas.width, height: screenshotCanvas.height });
                    await loadGallery();
                }, `image/${format}`, quality);
            } catch (error) {
                showStatus('撮影に失敗しました: ' + error.message, 'error');
            }
        }

        async function captureVisibleTab() {
            // Fallback implementation using canvas
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;

            const ctx = canvas.getContext('2d');
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            // Simple implementation: capture the visible viewport
            return canvas;
        }

        function startSelection() {
            isSelecting = true;
            document.getElementById('selectionOverlay').classList.add('active');
            selectionStart = null;
        }

        function stopSelection() {
            isSelecting = false;
            document.getElementById('selectionOverlay').classList.remove('active');
            document.getElementById('selectionBox').classList.remove('active');
        }

        // Tab Navigation
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                document.getElementById(tabId).classList.add('active');

                if (tabId === 'gallery') {
                    loadGallery();
                }
            });
        });

        // Button Events
        document.getElementById('fullscreenBtn').addEventListener('click', async () => {
            showStatus('取得中...', '');
            try {
                const format = document.getElementById('formatSelect').value;
                const quality = parseFloat(document.getElementById('qualitySlider').value);

                // Use html2canvas or getDisplayMedia approach
                const canvas = document.createElement('canvas');
                canvas.width = document.documentElement.scrollWidth || window.innerWidth;
                canvas.height = document.documentElement.scrollHeight || window.innerHeight;

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Create a more realistic capture
                const clonedBody = document.body.cloneNode(true);
                const tempContainer = document.createElement('div');
                tempContainer.appendChild(clonedBody);

                canvas.toBlob(async (blob) => {
                    await saveScreenshot(blob, { format, width: canvas.width, height: canvas.height });
                }, `image/${format}`, quality);
            } catch (error) {
                showStatus('エラー: ' + error.message, 'error');
            }
        });

        document.getElementById('selectionBtn').addEventListener('click', () => {
            showStatus('矩形をドラッグして領域を選択してください', '');
            startSelection();
        });

        document.getElementById('clipboardBtn').addEventListener('click', async () => {
            try {
                const format = document.getElementById('formatSelect').value;
                const quality = parseFloat(document.getElementById('qualitySlider').value);

                showStatus('取得中...', '');

                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                canvas.toBlob(async (blob) => {
                    await saveScreenshot(blob, { format, width: canvas.width, height: canvas.height });
                }, `image/${format}`, quality);
            } catch (error) {
                showStatus('エラー: ' + error.message, 'error');
            }
        });

        document.getElementById('clearAllBtn').addEventListener('click', clearAllScreenshots);

        document.getElementById('testCaptureBtn').addEventListener('click', async () => {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = 'white';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('テスト撮影: ' + new Date().toLocaleTimeString('ja-JP'), 200, 150);

            canvas.toBlob(async (blob) => {
                await saveScreenshot(blob, { format: 'png', width: 400, height: 300 });
                await loadGallery();
            }, 'image/png');
        });

        // Quality slider
        document.getElementById('qualitySlider').addEventListener('input', (e) => {
            const value = Math.round(parseFloat(e.target.value) * 100);
            document.getElementById('qualityValue').textContent = `品質: ${value}%`;
        });

        // Modal
        document.getElementById('closePreviewBtn').addEventListener('click', () => {
            document.getElementById('previewModal').classList.remove('show');
        });

        document.getElementById('downloadPreviewBtn').addEventListener('click', () => {
            if (currentImage) {
                const link = document.createElement('a');
                link.href = currentImage;
                link.download = `screenshot-${Date.now()}.png`;
                link.click();
            }
        });

        // Selection overlay events
        document.getElementById('selectionOverlay').addEventListener('click', () => {
            stopSelection();
        });

        // Initialize
        initDB().then(() => {
            loadGallery();
        }).catch(e => console.error('DB initialization failed:', e));

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed:', e));
        }
    </script>
</body>
</html>
